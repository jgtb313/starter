service: api-e2e

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1

custom:
  dotenv:
    path: ../../.env
    logging: false

plugins:
  - serverless-dotenv-plugin

functions:
  service:
    handler: src/main.handler
    events:
      - schedule: rate(24 hours)
