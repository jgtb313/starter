service: lambda-example-service

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1

custom:
  dotenv:
    path: ../../.env
    logging: false

plugins:
  - serverless-dotenv-plugin

resources:
  Resources:
    LambdaServiceExampleQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: lambda-example-service-queue

functions:
  service:
    handler: dist/main.handler
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - LambdaExampleServiceQueue
              - Arn
          batchSize: 1
          maximumBatchingWindow: 0
