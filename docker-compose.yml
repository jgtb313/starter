services:
  redis:
    container_name: starter-app_redis
    image: redis
    command: redis-server
    ports:
      - '6380:6379'
    volumes:
      - starter-app_redis-data:/data

  postgres:
    image: postgres:latest
    container_name: starter-app_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '5433:5432'
    volumes:
      - starter-app_postgres-data:/var/lib/postgresql/data
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.4.0
    container_name: starter-app_elasticsearch
    volumes:
      - starter-app_elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - '9201:9200'
    restart: always
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kibana:
    depends_on:
      - elasticsearch
    image: docker.elastic.co/kibana/kibana:8.4.0
    container_name: starter-app_kibana
    volumes:
      - starter-app_kibana-data:/usr/share/kibana/data
    ports:
      - '5602:5601'
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://starter-app_elasticsearch:9200

volumes:
  starter-app_redis-data:
  starter-app_postgres-data:
    driver: local
  starter-app_elasticsearch-data:
    driver: local
  starter-app_kibana-data:
    driver: local
